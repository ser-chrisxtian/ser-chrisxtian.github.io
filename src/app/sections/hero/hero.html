<section id="home" class="relative overflow-hidden" aria-labelledby="hero-title">
  <div
    class="container-page grid grid-cols-[minmax(0,1fr)] items-center gap-12 pt-10 pb-20 sm:pt-16 lg:grid-cols-[minmax(0,1.1fr)_minmax(0,0.9fr)] lg:gap-10 lg:pt-20 lg:pb-28"
  >
    <!-- Introduction -->
    <div class="page-enter">
      <h1
        id="hero-title"
        class="text-5xl leading-[1.05] font-medium tracking-tight text-ink sm:text-6xl lg:text-7xl"
      >
        <span class="block">Hello, I’m</span>
        <span class="block">{{ profile.name }}</span>
      </h1>

      <p
        class="mt-6 flex flex-wrap items-center gap-x-2 gap-y-1 font-display text-xl text-ink-soft sm:text-2xl"
      >
        @for (role of profile.roles; track role; let last = $last) {
          <span class="whitespace-nowrap">{{ role }}</span>
          @if (!last) {
            <span class="text-accent-text" aria-hidden="true">•</span>
          }
        }
      </p>

      <p class="mt-6 max-w-xl text-lg leading-relaxed text-muted">
        {{ profile.summary }}
      </p>

      <div class="mt-10 flex flex-wrap gap-3">
        <a routerLink="/" fragment="projects" class="btn btn-primary min-h-14 px-8 text-base">
          View my work
        </a>
        <a routerLink="/" fragment="about" class="btn btn-secondary min-h-14">About me</a>
        @if (hasGithub) {
          <a
            [href]="profile.githubUrl"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn-secondary min-h-14"
          >
            <svg appIcon="github" class="size-4"></svg>
            GitHub
          </a>
        }
        <app-resume-button class="[&_.btn]:min-h-14" />
      </div>
    </div>

    <!-- Portrait / illustration in a soft circle -->
    <div class="relative mx-auto w-full max-w-md lg:max-w-none">
      <div class="relative aspect-square overflow-hidden rounded-full bg-tile">
        @if (profile.photo; as photo) {
          <img
            [src]="photo.src"
            [alt]="photo.alt"
            width="800"
            height="800"
            fetchpriority="high"
            class="size-full object-cover"
          />
        } @else {
          <app-workspace-illustration class="absolute inset-0" />
        }
      </div>
    </div>
  </div>
</section>
