    <meta name="theme-color" content="#1b1613" />
    <meta name="color-scheme" content="dark light" />
    <link rel="canonical" href="https://ser-chrisxtian.github.io/" />

    <!-- Open Graph / social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Christian B. Peña" />
    <meta property="og:title" content="Christian B. Peña | IT Educator &amp; Software Developer" />

      content="Web applications, information systems, and IT education — the portfolio of Christian B. Peña."

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- Applies the saved or OS theme before first paint to avoid a flash (see ThemeService). -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var light = saved
            ? saved === 'light'
            : matchMedia('(prefers-color-scheme: light)').matches;
          if (light) {
            document.documentElement.classList.remove('dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#faf6ef');
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Outfit:wght@400;500;600&display=swap"
    />
  </head>
